<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="snake.css">
    <link rel="stylesheet" href="painel.css">
    <title>jogo da cobrinha</title>
</head>

<body>
    <main>

        <section id="menuPrincipal">
            <h1>Snake</h1>
            <p>selecione o modo de jogo</p>
            <button onclick="classico()">clássico</button>
            <button onclick="labirintos()">labirintos</button>
            <div>
                <p>dificuldade</p>
                <button id="dificuldade" onclick="dificuldade()">normal</button>
            </div>
        </section>


        <section id="gameOver">
            <h1>FIM DE JOGO</h1>
            <p>voce colidiu com <span id="colisao"></span></p>
            <p>pontuacao: <span id="pontosTotais">00</span></p>
            <button onclick="recomecar()">recomeçar</button>
            <button onclick="menu()">menu principal</button>
        </section>

        <section id="painel">
            <p>pontuacao: <span id="pontuacao">00</span></p>
        </section>



        <section id="conclusao">
            <h1>Parabéns</h1>
            <p>você concluiu o modo <span id="modo">labirintos</span></p>
            <button onclick="labirintos()">recomeçar</button>
            <button onclick="menu()">menu principal</button>
        </section>





        <canvas width="600" height="600"></canvas>


    </main>

   <div id="divPausa">
     <button onclick="painel.funcaoPausa()" id="pausa" title="ou barra de espaço">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-pause-fill" viewBox="0 0 16 16">
  <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"/>
</svg>
    </button>
   </div>

    <div id="controle">
        <button class="controles" onclick="controle.cima()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                class="bi bi-arrow-up-square-fill" viewBox="0 0 16 16">
                <path
                    d="M2 16a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2zm6.5-4.5V5.707l2.146 2.147a.5.5 0 0 0 .708-.708l-3-3a.5.5 0 0 0-.708 0l-3 3a.5.5 0 1 0 .708.708L7.5 5.707V11.5a.5.5 0 0 0 1 0" />
            </svg>
        </button>
        <div>
            <button class="controles" onclick="controle.esquerda()">
                <svg xmlns="http://www.w3.org/2000/svg"  fill="currentColor"
                    class="bi bi-arrow-left-square-fill" viewBox="0 0 16 16">
                    <path
                        d="M16 14a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2zm-4.5-6.5H5.707l2.147-2.146a.5.5 0 1 0-.708-.708l-3 3a.5.5 0 0 0 0 .708l3 3a.5.5 0 0 0 .708-.708L5.707 8.5H11.5a.5.5 0 0 0 0-1" />
                </svg>
            </button>

            

            <button class="controles" onclick="controle.direita()">
                <svg xmlns="http://www.w3.org/2000/svg"  fill="currentColor"
                    class="bi bi-arrow-right-square-fill" viewBox="0 0 16 16">
                    <path
                        d="M0 14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2a2 2 0 0 0-2 2zm4.5-6.5h5.793L8.146 5.354a.5.5 0 1 1 .708-.708l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L10.293 8.5H4.5a.5.5 0 0 1 0-1" />
                </svg>
            </button>
        </div>
        <button class="controles" onclick="controle.baixo()">
            <svg xmlns="http://www.w3.org/2000/svg"  fill="currentColor"
                class="bi bi-arrow-down-square-fill" viewBox="0 0 16 16">
                <path
                    d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm6.5 4.5v5.793l2.146-2.147a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 1 1 .708-.708L7.5 10.293V4.5a.5.5 0 0 1 1 0" />
            </svg>
        </button>
    </div>

    

    <script type="module" src="main.js"></script>
</body>

</html>
